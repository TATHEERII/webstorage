<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudStorage</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f5f7fa; color: #333; }
    .container { max-width: 900px; margin: 0 auto; padding: 20px; }
    .hidden { display: none !important; }
    .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-danger { background: #dc2626; color: white; }
    .btn-secondary { background: #6b7280; color: white; }
    .card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    input { width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 6px; margin-bottom: 12px; font-size: 14px; }
    input:focus { outline: none; border-color: #2563eb; }
    .auth-box { max-width: 400px; margin: 100px auto; }
    .auth-box h2 { margin-bottom: 20px; text-align: center; }
    .tab-bar { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #e5e7eb; }
    .tab { padding: 8px 16px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; }
    .tab.active { border-bottom-color: #2563eb; color: #2563eb; font-weight: 600; }
    .file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
    .file-card { background: white; border-radius: 8px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); cursor: pointer; transition: transform 0.2s; }
    .file-card:hover { transform: translateY(-2px); }
    .file-icon { font-size: 40px; text-align: center; margin-bottom: 8px; }
    .file-name { font-size: 14px; font-weight: 500; word-break: break-word; }
    .file-meta { font-size: 12px; color: #6b7280; margin-top: 4px; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; margin-bottom: 20px; }
    .header h1 { font-size: 24px; }
    .user-info { display: flex; align-items: center; gap: 12px; }
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 100; }
    .modal.active { display: flex; }
    .modal-content { background: white; border-radius: 12px; padding: 24px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #e5e7eb; }
    th { font-weight: 600; font-size: 13px; color: #6b7280; text-transform: uppercase; }
    .drop-zone { border: 2px dashed #d1d5db; border-radius: 12px; padding: 40px; text-align: center; cursor: pointer; transition: border-color 0.2s; }
    .drop-zone:hover { border-color: #2563eb; }
    .drop-zone.dragover { border-color: #2563eb; background: #eff6ff; }
    .empty-state { text-align: center; padding: 60px 20px; color: #9ca3af; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 500; }
    .badge-admin { background: #dbeafe; color: #1e40af; }
    .badge-user { background: #f3f4f6; color: #6b7280; }
    .actions { display: flex; gap: 8px; }
    .switch { display: flex; gap: 8px; margin-bottom: 12px; }
    .switch button { padding: 6px 12px; border: 1px solid #d1d5db; background: white; cursor: pointer; border-radius: 4px; }
    .switch button.active { background: #2563eb; color: white; border-color: #2563eb; }
  </style>
</head>
<body>
  <div id="app">
    <div id="auth-view" class="auth-box">
      <div class="card">
        <div class="tab-bar">
          <div class="tab active" onclick="showAuthTab('login')">Login</div>
          <div class="tab" onclick="showAuthTab('register')">Register</div>
        </div>
        <div id="login-form">
          <h2>Login</h2>
          <input type="email" id="login-email" placeholder="Email" />
          <input type="password" id="login-password" placeholder="Password" />
          <button class="btn btn-primary" style="width:100%" onclick="login()">Login</button>
        </div>
        <div id="register-form" class="hidden">
          <h2>Register</h2>
          <input type="text" id="reg-name" placeholder="Full Name" />
          <input type="email" id="reg-email" placeholder="Email" />
          <input type="password" id="reg-password" placeholder="Password" />
          <button class="btn btn-primary" style="width:100%" onclick="register()">Register</button>
        </div>
      </div>
    </div>

    <div id="main-view" class="container hidden">
      <div class="header">
        <h1>CloudStorage</h1>
        <div class="user-info">
          <span id="user-name"></span>
          <span id="user-role" class="badge"></span>
          <button class="btn btn-secondary" id="admin-btn" onclick="openAdmin()">Admin</button>
          <button class="btn btn-danger" onclick="logout()">Logout</button>
        </div>
      </div>

      <div class="card">
        <div class="tab-bar">
          <div class="tab active" onclick="showTab('my-files')">My Files</div>
          <div class="tab" onclick="showTab('shared-files')">Shared with Me</div>
        </div>
        <div id="my-files-tab">
          <div class="switch">
            <button class="active" onclick="setVisibility('private', this)">Private</button>
            <button onclick="setVisibility('shared', this)">Shared by Me</button>
          </div>
          <div class="drop-zone" onclick="document.getElementById('file-input').click()">
            <div style="font-size: 48px; margin-bottom: 10px;">+</div>
            <div>Click or drag files here to upload</div>
            <input type="file" id="file-input" class="hidden" onchange="uploadFile(this.files[0])" />
          </div>
          <div id="files-container" style="margin-top: 20px;"></div>
        </div>
        <div id="shared-files-tab" class="hidden">
          <div id="shared-container"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="admin-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Admin Panel - User Management</h3>
        <button class="close-btn" onclick="closeAdmin()">&times;</button>
      </div>
      <div style="display: flex; gap: 8px; margin-bottom: 16px;">
        <input type="email" id="new-user-email" placeholder="Email" style="flex:1" />
        <input type="text" id="new-user-name" placeholder="Name" style="flex:1" />
        <input type="password" id="new-user-password" placeholder="Password" style="flex:1" />
        <button class="btn btn-primary" onclick="createUser()">Create User</button>
      </div>
      <div id="admin-users-table"></div>
    </div>
  </div>

  <script>
    const API_BASE = '';
    let session = null;
    let currentUser = null;
    let currentVisibility = 'private';

    function showAuthTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      if (tab === 'login') {
        document.getElementById('login-form').classList.remove('hidden');
        document.getElementById('register-form').classList.add('hidden');
      } else {
        document.getElementById('login-form').classList.add('hidden');
        document.getElementById('register-form').classList.remove('hidden');
      }
    }

    async function apiCall(path, options = {}) {
      const res = await fetch(API_BASE + path, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          'X-Session-ID': session || '',
          ...options.headers
        }
      });
      return res.json();
    }

    async function register() {
      const name = document.getElementById('reg-name').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;
      const res = await apiCall('/api/register', {
        method: 'POST',
        body: JSON.stringify({ name, email, password })
      });
      if (res.error) return alert(res.error);
      session = res.session.id;
      currentUser = res.user;
      showMain();
    }

    async function login() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const res = await apiCall('/api/login', {
        method: 'POST',
        body: JSON.stringify({ email, password })
      });
      if (res.error) return alert(res.error);
      session = res.session.id;
      currentUser = res.user;
      showMain();
    }

    function logout() {
      apiCall('/api/logout', { method: 'POST' });
      session = null;
      currentUser = null;
      document.getElementById('auth-view').classList.remove('hidden');
      document.getElementById('main-view').classList.add('hidden');
    }

    function showMain() {
      document.getElementById('auth-view').classList.add('hidden');
      document.getElementById('main-view').classList.remove('hidden');
      document.getElementById('user-name').textContent = currentUser.name;
      const roleBadge = document.getElementById('user-role');
      roleBadge.textContent = currentUser.role;
      roleBadge.className = currentUser.role === 'admin' ? 'badge badge-admin' : 'badge badge-user';
      document.getElementById('admin-btn').style.display = currentUser.role === 'admin' ? 'inline-block' : 'none';
      loadFiles();
      loadShared();
    }

    function showTab(tab) {
      document.querySelectorAll('#main-view .tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      if (tab === 'my-files') {
        document.getElementById('my-files-tab').classList.remove('hidden');
        document.getElementById('shared-files-tab').classList.add('hidden');
      } else {
        document.getElementById('my-files-tab').classList.add('hidden');
        document.getElementById('shared-files-tab').classList.remove('hidden');
      }
    }

    function setVisibility(vis, btn) {
      currentVisibility = vis;
      btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      loadFiles();
    }

    async function uploadFile(file) {
      if (!file) return;
      const formData = new FormData();
      formData.append('file', file);
      formData.append('visibility', currentVisibility);
      const res = await fetch(API_BASE + '/api/files', {
        method: 'POST',
        headers: { 'X-Session-ID': session },
        body: formData
      });
      const data = await res.json();
      if (data.error) return alert(data.error);
      document.getElementById('file-input').value = '';
      loadFiles();
    }

    async function loadFiles() {
      const res = await apiCall('/api/files', {
        headers: { 'X-Visibility': currentVisibility }
      });
      if (res.error) return;
      renderFiles(res.files, 'files-container', false);
    }

    async function loadShared() {
      const res = await apiCall('/api/shared');
      if (res.error) return;
      renderFiles(res.files, 'shared-container', true);
    }

    function renderFiles(files, containerId, isShared) {
      const container = document.getElementById(containerId);
      if (files.length === 0) {
        container.innerHTML = '<div class="empty-state">No files yet</div>';
        return;
      }
      container.innerHTML = '<div class="file-grid">' + files.map(f => {
        const icon = getFileIcon(f.type);
        const date = new Date(f.createdAt).toLocaleDateString();
        return `<div class="file-card" onclick="downloadFile('${f.id}', '${f.owner}')">
          <div class="file-icon">${icon}</div>
          <div class="file-name">${f.name}</div>
          <div class="file-meta">${formatSize(f.size)} - ${date}${isShared ? ' <br>from ' + f.owner : ''}</div>
        </div>`;
      }).join('') + '</div>';
    }

    async function downloadFile(fileId, owner) {
      const url = `${API_BASE}/api/files/download?id=${fileId}&owner=${owner}`;
      const a = document.createElement('a');
      a.href = url;
      a.download = fileId;
      a.click();
    }

    async function deleteFile(fileId, owner) {
      if (!confirm('Delete this file?')) return;
      await apiCall('/api/files', {
        method: 'DELETE',
        body: JSON.stringify({ fileId, owner })
      });
      loadFiles();
      loadShared();
    }

    function getFileIcon(type) {
      if (type.includes('image')) return '🖼️';
      if (type.includes('pdf')) return '📄';
      if (type.includes('video')) return '🎥';
      if (type.includes('audio')) return '🎵';
      if (type.includes('zip') || type.includes('rar')) return '🗜️';
      return '📁';
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    async function openAdmin() {
      if (!currentUser || currentUser.role !== 'admin') return;
      const res = await apiCall('/api/admin/users');
      if (res.error) return alert(res.error);
      const tbody = document.getElementById('admin-users-table');
      tbody.innerHTML = '<table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Action</th></tr></thead><tbody>' +
        res.users.map(u => `<tr>
          <td>${u.name}</td>
          <td>${u.email}</td>
          <td><span class="badge ${u.role === 'admin' ? 'badge-admin' : 'badge-user'}">${u.role}</span></td>
          <td>${u.email !== currentUser.email ? `<button class="btn btn-danger" style="padding:4px 10px;font-size:12px" onclick="deleteUser('${u.email}')">Delete</button>` : ''}</td>
        </tr>`).join('') + '</tbody></table>';
      document.getElementById('admin-modal').classList.add('active');
    }

    function closeAdmin() {
      document.getElementById('admin-modal').classList.remove('active');
    }

    async function createUser() {
      const email = document.getElementById('new-user-email').value;
      const name = document.getElementById('new-user-name').value;
      const password = document.getElementById('new-user-password').value;
      const res = await apiCall('/api/admin/users', {
        method: 'POST',
        body: JSON.stringify({ email, name, password, role: 'user' })
      });
      if (res.error) return alert(res.error);
      document.getElementById('new-user-email').value = '';
      document.getElementById('new-user-name').value = '';
      document.getElementById('new-user-password').value = '';
      openAdmin();
    }

    async function deleteUser(email) {
      if (!confirm(`Delete user ${email}?`)) return;
      const res = await apiCall('/api/admin/users', {
        method: 'DELETE',
        body: JSON.stringify({ email })
      });
      if (res.error) return alert(res.error);
      openAdmin();
    }

    async function checkSession() {
      const res = await apiCall('/api/me');
      if (!res.error && res.user) {
        session = 'keep';
        currentUser = res.user;
        showMain();
      }
    }

    checkSession();
  </script>
</body>
</html>
